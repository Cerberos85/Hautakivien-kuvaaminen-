<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hautausmaa-Doc</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker rekisteröity', reg))
        .catch(err => console.log('SW virhe', err));
    });
  }
</script>
</head>
<body>

    <header>
        <h1>Hautapaikkadokumentointi</h1>
    </header>

    <main id="app">
        <section class="controls">
            <label for="camera-input" class="btn btn-primary">
                Ota kuva / Valitse galleriasta
                <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
            </label>
            <button id="generate-report" class="btn btn-secondary">Luo raportti (.docx)</button>
        </section>

        <section id="photo-list" class="photo-grid">
            </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/report.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
