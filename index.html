<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoitamattomuus-kuvaus</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Word- ja tallennuskirjastot (selainyhteensopiva UMD-versio) -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b4c3b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2891/2891415.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .catch(err => console.error('SW virhe:', err));
        });
      }
    </script>

    <script src="js/storage.js" defer></script>
    <script src="js/report.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Hautapaikkojen valokuvaus hoitamattomuuden perusteella</h1>
    </header>

    <main id="app">
        <section class="controls top-controls">
            <label for="camera-input" class="btn btn-primary">
                <span class="material-symbols-outlined">add_a_photo</span>
                Ota uusi kuva
            </label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
        </section>

        <section id="photo-list" class="photo-grid"></section>
    </main>

    <div class="floating-bottom-bar">
        <button id="generate-report" class="btn btn-secondary">
            <span class="material-symbols-outlined">description</span>
            Luo raportti (.docx)
        </button>
    </div>

</body>
</html>
